<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guitar Challenge Generator</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0; padding: 1rem;
      display: flex; flex-direction: column;
      gap: 1rem;
    }
    header, main, footer {
      width: 99%;
    }
    header {
      display: flex; align-items: center; gap: 1rem;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
    }
    .column {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 4px;
    }
    .category {
      margin-bottom: 1rem;
    }
    .category label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.25rem;
    }
    .mastery-levels {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .mastery-levels label {
      font-size: 0.9rem;
    }
    footer {
      margin-top: 1rem;
    }
    #challengeOutput {
      margin-top: 1rem;
      white-space: pre-wrap;
      background: #f9f9f9;
      padding: 1rem;
      border-radius: 4px;
      min-height: 6rem;
    }
  </style>
</head>
<body>
  <header>
    <label for="keySelect">Key:</label>
    <select id="keySelect">
      <option value="random">Random</option>
      <option value="A">A</option>
      <option value="A#">A# / Bb</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="C#">C# / Db</option>
      <option value="D">D</option>
      <option value="D#">D# / Eb</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="F#">F# / Gb</option>
      <option value="G">G</option>
      <option value="G#">G# / Ab</option>
    </select>
    <button id="generateBtn">Generate Challenge</button>
  </header>

  <main>
    <!-- PHYSICAL COLUMN -->
    <section class="column" id="physicalColumn">
      <h2>Physical</h2>
      <div class="category">
        <label for="attrPhysical">Attribute:</label>
        <select id="attrPhysical">
          <option value="random">Random</option>
          <option value="Dexterity">Dexterity</option>
          <option value="Strength">Strength</option>
          <option value="Precision">Precision</option>
          <option value="Intelligence">Intelligence</option>
          <option value="Creativity">Creativity</option>
          <option value="Stamina">Stamina</option>
          <option value="Charisma">Charisma</option>
          <option value="Wisdom">Wisdom</option>
          <option value="Flexibility">Flexibility</option>
        </select>
      </div>

      <div class="category">
        <label for="guitarmanshipSelect">Guitarmanship:</label>
        <select id="guitarmanshipSelect">
          <option value="random">Random</option>
          <!-- options populated dynamically -->
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="guitarmanship" value="1">1</label>
          <label><input type="checkbox" data-category="guitarmanship" value="2">2</label>
          <label><input type="checkbox" data-category="guitarmanship" value="3">3</label>
          <label><input type="checkbox" data-category="guitarmanship" value="4">4</label>
          <label><input type="checkbox" data-category="guitarmanship" value="5">5</label>
        </div>
      </div>

      <div class="category">
        <label for="pickingSelect">Picking Hand Technique:</label>
        <select id="pickingSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="picking" value="1">1</label>
          <label><input type="checkbox" data-category="picking" value="2">2</label>
          <label><input type="checkbox" data-category="picking" value="3">3</label>
          <label><input type="checkbox" data-category="picking" value="4">4</label>
          <label><input type="checkbox" data-category="picking" value="5">5</label>
        </div>
      </div>

      <div class="category">
        <label for="frettingSelect">Fretting Hand Technique:</label>
        <select id="frettingSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="fretting" value="1">1</label>
          <label><input type="checkbox" data-category="fretting" value="2">2</label>
          <label><input type="checkbox" data-category="fretting" value="3">3</label>
          <label><input type="checkbox" data-category="fretting" value="4">4</label>
          <label><input type="checkbox" data-category="fretting" value="5">5</label>
        </div>
      </div>

      <div class="category">
        <label for="stringSelect">String Challenge:</label>
        <select id="stringSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="string" value="1">1</label>
          <label><input type="checkbox" data-category="string" value="2">2</label>
          <label><input type="checkbox" data-category="string" value="3">3</label>
          <label><input type="checkbox" data-category="string" value="4">4</label>
          <label><input type="checkbox" data-category="string" value="5">5</label>
        </div>
      </div>
    </section>

    <!-- MENTAL COLUMN -->
    <section class="column" id="mentalColumn">
      <h2>Mental</h2>
      <div class="category">
        <label for="attrMental">Attribute:</label>
        <select id="attrMental">
          <option value="random">Random</option>
          <option value="Dexterity">Dexterity</option>
          <option value="Strength">Strength</option>
          <option value="Precision">Precision</option>
          <option value="Intelligence">Intelligence</option>
          <option value="Creativity">Creativity</option>
          <option value="Stamina">Stamina</option>
          <option value="Charisma">Charisma</option>
          <option value="Wisdom">Wisdom</option>
          <option value="Flexibility">Flexibility</option>
        </select>
      </div>

      <div class="category">
        <label for="musicianshipSelect">Musicianship:</label>
        <select id="musicianshipSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="musicianship" value="1">1</label>
          <label><input type="checkbox" data-category="musicianship" value="2">2</label>
          <label><input type="checkbox" data-category="musicianship" value="3">3</label>
          <label><input type="checkbox" data-category="musicianship" value="4">4</label>
          <label><input type="checkbox" data-category="musicianship" value="5">5</label>
        </div>
      </div>

      <div class="category">
        <label for="scalesSelect">Scales &amp; Modes:</label>
        <select id="scalesSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="scales" value="1">1</label>
          <label><input type="checkbox" data-category="scales" value="2">2</label>
          <label><input type="checkbox" data-category="scales" value="3">3</label>
          <label><input type="checkbox" data-category="scales" value="4">4</label>
          <label><input type="checkbox" data-category="scales" value="5">5</label>
        </div>
      </div>

      <div class="category">
        <label for="rhythmSelect">Rhythm:</label>
        <select id="rhythmSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="rhythm" value="1">1</label>
          <label><input type="checkbox" data-category="rhythm" value="2">2</label>
          <label><input type="checkbox" data-category="rhythm" value="3">3</label>
          <label><input type="checkbox" data-category="rhythm" value="4">4</label>
          <label><input type="checkbox" data-category="rhythm" value="5">5</label>
        </div>
      </div>

      <div class="category">
        <label for="playStyleSelect">Play Style:</label>
        <select id="playStyleSelect">
          <option value="random">Random</option>
        </select>
        <div class="mastery-levels">
          <label><input type="checkbox" data-category="playStyle" value="1">1</label>
          <label><input type="checkbox" data-category="playStyle" value="2">2</label>
          <label><input type="checkbox" data-category="playStyle" value="3">3</label>
          <label><input type="checkbox" data-category="playStyle" value="4">4</label>
          <label><input type="checkbox" data-category="playStyle" value="5">5</label>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <h3>Your Challenge</h3>
    <div id="challengeOutput">Press “Generate Challenge” to begin…</div>
  </footer>

  <script src="challenge.js"></script>
  
</body>
</html>
