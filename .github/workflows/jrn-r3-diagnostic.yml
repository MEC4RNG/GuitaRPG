name: JRN R3 temporary format and compile diagnostic
on:
  push:
    branches:
      - journey-r3-map-explore-workbook-ux
    paths:
      - ".github/workflows/jrn-r3-diagnostic.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Print exact Prettier fixes without committing
        run: |
          npx prettier --write components/quest-journey-surface.tsx components/workbook-editor-prototype.tsx components/codex-v2-entry.tsx components/workbook-persistence-surface.tsx app/workbooks/page.tsx lib/workbook/lesson-template.ts tests/e2e/quest-journey.spec.ts tests/e2e/workbook-prototype.spec.ts tests/codex-v2-lesson-workbook.test.ts app/globals.css
          git --no-pager diff -- components/quest-journey-surface.tsx components/workbook-editor-prototype.tsx components/codex-v2-entry.tsx components/workbook-persistence-surface.tsx app/workbooks/page.tsx lib/workbook/lesson-template.ts tests/e2e/quest-journey.spec.ts tests/e2e/workbook-prototype.spec.ts tests/codex-v2-lesson-workbook.test.ts app/globals.css
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
