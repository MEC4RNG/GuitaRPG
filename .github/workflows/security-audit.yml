name: Release security audit

on:
  push:
    branches:
      - v1-production
  pull_request:
    branches:
      - v1-production

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install deterministic dependency graph
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Audit complete dependency graph
        run: npm run security:audit
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked source and reachable history
        run: npm run security:scan
      - name: Run release security tests
        run: npm run test:security
      - name: Build production application
        run: npm run build
      - name: Scan browser assets
        run: npm run security:scan-browser
