name: Database contract tests

on:
  push:
    branches:
      - v1-production
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  pull_request:
    branches:
      - v1-production
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0

      - name: Start local database
        run: supabase db start

      - name: Run pgTAP database tests
        run: supabase test db
