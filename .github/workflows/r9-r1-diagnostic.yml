name: R9-R1 temporary validation diagnostics
on:
  push:
    branches:
      - codex-v2-r9-r1-history-landscape
    paths:
      - ".github/workflows/r9-r1-diagnostic.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Show exact Prettier corrections without writing to GitHub
        run: |
          npx prettier --write components/codex-v2-library.tsx app/globals.css tests/e2e/codex-v2-preview.spec.ts
          git --no-pager diff -- components/codex-v2-library.tsx app/globals.css tests/e2e/codex-v2-preview.spec.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
