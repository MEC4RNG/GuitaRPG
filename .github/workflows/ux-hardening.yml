name: UX release hardening

on:
  push:
    branches:
      - v1-production
    paths:
      - "app/**"
      - "components/**"
      - "lib/ux/**"
      - "tests/e2e/**"
      - "tests/ux-hardening.test.ts"
      - "playwright.config.ts"
      - "package.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/ux-hardening.yml"
  pull_request:
    branches:
      - v1-production
    paths:
      - "app/**"
      - "components/**"
      - "lib/ux/**"
      - "tests/e2e/**"
      - "tests/ux-hardening.test.ts"
      - "playwright.config.ts"
      - "package.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/ux-hardening.yml"

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0

      - name: Start local Supabase
        shell: bash
        run: supabase start || { supabase stop --no-backup || true; supabase start; }

      - name: Export local public Supabase configuration
        shell: bash
        run: |
          status="$(supabase status -o json)"
          secret="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' <<< "$status")"
          echo "::add-mask::$secret"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<< "$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<< "$status")" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$secret" >> "$GITHUB_ENV"

      # GitHub runner images do not guarantee WebKit's OS libraries. Pure
      # browser downloads passed but the WebKit browser matrix failed on missing
      # GTK/GStreamer libraries (JRN-002 closeout run 42224550277).
      # Azure's apt mirror intermittently hung for the full 40-minute job limit.
      # Bound apt network waits and skip that primary mirror; retain all browsers.
      - name: Configure bounded apt access for Playwright
        run: |
          sudo tee /etc/apt/apt.conf.d/99-guitarpg-playwright-ci >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          EOF
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install browser engines and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build application
        run: npm run build

      - name: Verify UX source contracts
        run: npx vitest run tests/ux-hardening.test.ts

      - name: Run accessibility, browser, responsive, recovery, and performance gates
        run: npm run test:ux-hardening

      - name: Run contextual Codex Peek journey matrix
        run: npm run test:codex-peek-e2e

      - name: Run Workbook prototype interaction matrix
        run: npm run test:workbook-prototype

      - name: Run persistent Workbook musical-block regression
        run: npx playwright test tests/e2e/workbook-persistence.spec.ts --project=chromium --project=mobile-chromium --project=webkit --project=mobile-webkit --workers=1

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
