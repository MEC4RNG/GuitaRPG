name: MEC R12 temporary validation probe
on:
  push:
    branches:
      - ux-mec-r12-map-explore-codex-links
    paths:
      - ".github/workflows/mec-r12-probe.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Show exact formatting corrections without GitHub writes
        run: |
          npx prettier --write app/quest/'[questId]'/page.tsx app/workbooks/page.tsx components/quest-journey-surface.tsx components/codex-v2-entry.tsx components/workbook-persistence-surface.tsx components/workbook-editor-prototype.tsx app/globals.css tests/e2e/quest-journey.spec.ts tests/e2e/codex-v2-preview.spec.ts tests/e2e/workbook-prototype.spec.ts tests/codex-v2-lesson-workbook.test.ts tests/jrn-004-r1-workspaces.test.ts lib/workbook/lesson-template.ts
          git --no-pager diff -- app/quest/'[questId]'/page.tsx app/workbooks/page.tsx components/quest-journey-surface.tsx components/codex-v2-entry.tsx components/workbook-persistence-surface.tsx components/workbook-editor-prototype.tsx app/globals.css tests/e2e/quest-journey.spec.ts tests/e2e/codex-v2-preview.spec.ts tests/e2e/workbook-prototype.spec.ts tests/codex-v2-lesson-workbook.test.ts tests/jrn-004-r1-workspaces.test.ts lib/workbook/lesson-template.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
