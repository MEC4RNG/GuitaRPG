name: R6 temporary format diagnostics
on:
  push:
    branches:
      - codex-v2-r6-interval-arpeggio-curriculum
    paths:
      - ".github/workflows/r6-format-probe.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Show exact R6 Prettier diff without repository writes
        run: |
          npx prettier --write tests/codex-v2-foundation.test.ts tests/e2e/codex-v2-preview.spec.ts
          git --no-pager diff -- tests/codex-v2-foundation.test.ts tests/e2e/codex-v2-preview.spec.ts
