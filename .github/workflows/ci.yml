name: Production scaffold CI

on:
  push:
    branches:
      - v1-production
  pull_request:
    branches:
      - v1-production

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        # Shrinkwrap locks the graph; legacy peer resolution temporarily bypasses
        # npm Arborist's current `edgesOut` crash.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
