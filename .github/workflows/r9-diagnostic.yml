name: R9 temporary format and compile diagnostic
on:
  push:
    branches:
      - codex-v2-r9-shared-fretboard-engine
    paths:
      - ".github/workflows/r9-diagnostic.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Show exact R9 Prettier corrections without committing
        run: |
          npx prettier --write lib/codex/v2/fretboard-engine.ts components/codex-v2-fretboard.tsx components/codex-v2-reference.tsx lib/codex/v2/content.ts app/globals.css tests/codex-v2-r9-fretboard-engine.test.ts tests/e2e/codex-v2-preview.spec.ts tests/codex-v2-foundation.test.ts tests/codex-v2-r6-curriculum.test.ts tests/codex-v2-r7-curriculum.test.ts tests/codex-v2-r8-curriculum.test.ts
          git --no-pager diff -- lib/codex/v2/fretboard-engine.ts components/codex-v2-fretboard.tsx components/codex-v2-reference.tsx lib/codex/v2/content.ts app/globals.css tests/codex-v2-r9-fretboard-engine.test.ts tests/e2e/codex-v2-preview.spec.ts tests/codex-v2-foundation.test.ts tests/codex-v2-r6-curriculum.test.ts tests/codex-v2-r7-curriculum.test.ts tests/codex-v2-r8-curriculum.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
