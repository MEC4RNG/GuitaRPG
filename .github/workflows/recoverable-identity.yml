name: Recoverable identity integration

on:
  push:
    branches:
      - v1-production
    paths:
      - "app/auth/**"
      - "components/account-recovery-panel.tsx"
      - "lib/auth/**"
      - "lib/supabase/server.ts"
      - "next.config.ts"
      - "playwright.config.ts"
      - "proxy.ts"
      - "supabase/config.toml"
      - "supabase/templates/**"
      - "tests/auth/**"
      - "tests/e2e/recoverable-identity.spec.ts"
      - ".github/workflows/recoverable-identity.yml"
  pull_request:
    branches:
      - v1-production
    paths:
      - "app/auth/**"
      - "components/account-recovery-panel.tsx"
      - "lib/auth/**"
      - "lib/supabase/server.ts"
      - "next.config.ts"
      - "playwright.config.ts"
      - "proxy.ts"
      - "supabase/config.toml"
      - "supabase/templates/**"
      - "tests/auth/**"
      - "tests/e2e/recoverable-identity.spec.ts"
      - ".github/workflows/recoverable-identity.yml"

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0

      - name: Start local Supabase
        shell: bash
        run: supabase start || { supabase stop --no-backup || true; supabase start; }

      - name: Verify guest upgrade and recovery
        run: node tests/auth/recoverable-identity.local.mjs

      - name: Export local public Supabase configuration
        shell: bash
        run: |
          status="$(supabase status -o json)"
          secret="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' <<< "$status")"
          echo "::add-mask::$secret"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<< "$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<< "$status")" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$secret" >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build

      - name: Run desktop and Pixel 7 browser regressions
        run: npx playwright test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
