name: Recoverable identity integration

on:
  push:
    branches:
      - v1-production
    paths:
      - "app/auth/**"
      - "components/account-recovery-panel.tsx"
      - "lib/auth/**"
      - "supabase/config.toml"
      - "supabase/templates/**"
      - "tests/auth/**"
      - ".github/workflows/recoverable-identity.yml"
  pull_request:
    branches:
      - v1-production
    paths:
      - "app/auth/**"
      - "components/account-recovery-panel.tsx"
      - "lib/auth/**"
      - "supabase/config.toml"
      - "supabase/templates/**"
      - "tests/auth/**"
      - ".github/workflows/recoverable-identity.yml"

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Verify guest upgrade and recovery
        run: node tests/auth/recoverable-identity.local.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
