name: F4B-R1 read-only formatter diagnostic
on:
  pull_request:
    branches: [design-f4b-codex-reading]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.head_ref == 'design-f4b-r1-format-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format and print exact patch
        run: |
          npm run format
          echo F4B-R1_PATCH_BEGIN
          git diff --no-color --no-ext-diff
          echo F4B-R1_PATCH_END
          npm run format:check
      - name: Lint
        if: always()
        run: npm run lint
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Unit tests
        if: always()
        run: npm run test
